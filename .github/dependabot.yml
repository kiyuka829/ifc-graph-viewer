version: 2

updates:
  - package-ecosystem: npm
    directory: /nodejs
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
